[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-remediate"
version = "0.1.0"
description = "Deterministic DevSecOps remediation pipeline with strict agentic safety guardrails"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Juan De Andrade", email = "cibi-dev@users.noreply.github.com"}]
dependencies = [
    "typer>=0.9.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "rich>=13.0.0,<14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "bandit>=1.7.0",
]

[project.scripts]
auto-remediate = "auto_remediate.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
